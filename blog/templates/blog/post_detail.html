{% extends 'base.html' %}
{% load static %}

{% block title %} {{ post.title }} {% endblock %}

{% block extra_header %}
<link rel="stylesheet" href="{% static 'blog/css/post_detail.css' %}">
{% endblock %}

{% block content %}

<div class="section">
    <div class="post-container">
        <div class="post-info">
            <span class="post-title">{{ post.title }}</span>
            <span class="post-date">{{ post.created_at|date:"d M Y" }}</span>
        </div>
        <div class="post-body" id="postBody">
            {{ post.body|linebreaksbr|urlize }}
        </div>
    </div>
</div>

{% endblock %}

{% block extra_body %}
<script src="{% static 'blog/js/post_detail.js' %}"></script>
{% endblock %}
